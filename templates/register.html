{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 80px auto; background-color: var(--bg-secondary); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color);">
    <div style="text-align: center; margin-bottom: 25px;">
        <h2><i class="fa-solid fa-user-plus" style="color: var(--accent-cyan);"></i> Register Analyst</h2>
    </div>
    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">Register</button>
    </form>
    <div style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
        <a href="{{ url_for('auth.login') }}" style="color: var(--accent-cyan); text-decoration: none;">Already have an account? Sign in</a>
    </div>
</div>
{% endblock %}
