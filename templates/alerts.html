{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2>Security Alerts Management</h2>
    <div style="display: flex; gap: 10px;">
        <select id="filter-status" class="form-control" onchange="loadAlerts()">
            <option value="All">All Statuses</option>
            <option value="Open" selected>Open</option>
            <option value="Acknowledged">Acknowledged</option>
            <option value="Resolved">Resolved</option>
        </select>
        <select id="filter-severity" class="form-control" onchange="loadAlerts()">
            <option value="All">All Severities</option>
            <option value="Critical">Critical</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select>
    </div>
</div>

<div class="panel">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Timestamp</th>
                <th>Alert Type</th>
                <th>Source IP</th>
                <th>Target User</th>
                <th>Severity</th>
                <th>Description / Reason</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="alerts-table-body">
            <tr><td colspan="9" style="text-align: center; color: var(--text-muted);">Loading active security alerts...</td></tr>
        </tbody>
    </table>
</div>

<script src="{{ url_for('static', filename='js/alerts.js') }}"></script>
{% endblock %}
