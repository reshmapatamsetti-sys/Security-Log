{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 80px auto; background-color: var(--bg-secondary); padding: 30px; border-radius: 8px; border: 1px solid var(--border-color);">
    <div style="text-align: center; margin-bottom: 25px;">
        <h2><i class="fa-solid fa-shield-halved" style="color: var(--accent-cyan);"></i> SecureLog Portal</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">Sign in to access threat monitoring</p>
    </div>
    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" class="form-control" required placeholder="admin">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">Sign In</button>
    </form>
    <div style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
        <span style="color: var(--text-muted);">Default credentials:</span> admin / admin123<br>
        <a href="{{ url_for('auth.register') }}" style="color: var(--accent-cyan); text-decoration: none; display: inline-block; margin-top: 10px;">Create an analyst account</a>
    </div>
</div>
{% endblock %}
